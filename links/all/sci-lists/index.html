<html lang=ja>
  <head>

    <meta name="description" content="Online Chemistry Contestは、Online X Contestで開催予定の競技科学コンテスト。"/>
    <meta title="Online Chemistry Contest - 競技化学">
  </head>
  <body>
    <noscript><p>JavaScriptをオンにしてください。</p></noscript>
  </body>
  <script>
    // 画面幅が768ピクセル以下の場合はスマホとみなす
    // AIに任せたから意味が分からん
    function g(n){
      return document.getElementById(n)
    }
    if (window.matchMedia('(max-width: 768px)').matches) {// スマホ表示用の処理
      location.replace("phone.html")
    } else {// PC表示用の処理
      location.replace("pc.html")
    }

  </script>
</html>
